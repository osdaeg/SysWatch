[GMAIL]
protocol=imap
auth=password
host=imap.gmail.com
port=993
tls=true
username_env=GMAIL_USER
password_env=GMAIL_PASSWORD
folder=INBOX

[OUTLOOK]
protocol=imap
auth=oauth2
host=outlook.office365.com
port=993
tls=true
username_env=OUTLOOK_USER
token_env=OUTLOOK_TOKEN
folder=INBOX

[PROTON]
protocol=imap
auth=password
host=127.0.0.1
port=1143
tls=false
username_env=PROTON_USER
password_env=PROTON_PASSWORD
folder=INBOX

[LOCAL-MBOX]
protocol=mbox
path=/var/mail/daniel

